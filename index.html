<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <div id="container" class="grad">
            <div onclick="modal.showModal()" class="box">
                <div id="time" class="pulse">{{time}}</div>
                <p id="cursor">click</p>
            </div>
        </div>
        
        <dialog id="modal" tabindex="-1">
            <h1>INTRODUE</h1>
            <form method="dialog">
                <button value="view">view</button>
                <button value="close">close</button>
            </form>
        </dialog>
    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                time: ''
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                let self = this;
                setInterval(() => {
                    let datetime = new Date();
                    let hh = datetime.getHours() < 10 ? '0' + datetime.getHours() : datetime.getHours();
                    let mi = datetime.getMinutes();
                    let ss = datetime.getSeconds();
                    if (mi < 10) {
                        mi = '0' + mi;
                    }
                    if (ss < 10) {
                        ss = '0' + ss;
                    }
                    self.time = `${hh}:${mi}:${ss}`;
                }, 1000);
            }
        }, // methods
        mounted() {
            let self = this;
            self.fnTest();
        }
    });

    app.mount('#app');

    const modal = document.querySelector("#modal");

    modal.addEventListener("close", () => {
        if (modal.returnValue === "view") {
            if (confirm('이동하시겠습니까?')) {
                location.href = 'https://midline15.github.io/deploy202610/introduction/introduce.html';
            } else {
                return;
            }
        } else {
            return;
        }
    });

    const cursor = document.querySelector("#cursor");

    document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + 5 + "px";
        cursor.style.top = e.clientY + 5 + "px";
    });
</script>
